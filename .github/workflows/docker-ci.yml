name: Docker CI Pipeline

on:
  push:
    branches: [ main action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME 
          password: ${{ secrets.DOCKER_PASSWORD 

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME /flask-app:v2 .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME /flask-app:v2
